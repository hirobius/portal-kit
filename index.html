<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Hirobius Portal Kit — Demo</title>
<link rel="stylesheet" href="/theme.css" />
<style>
  #fallback { max-width:640px; margin:0 auto; padding:2rem 1.25rem;
    font-family:system-ui, sans-serif; line-height:1.55; color:#141414; }
</style>
</head>
<body>
  <!-- This demo renders sample data through the shared theme + renderer, exactly
       the way a real client page does — showcasing several section types so a
       theme.css or portal.js edit can be confirmed live. Real client pages live
       in their own repos and link this host's /theme.css and /portal.js. -->
  <script type="application/json" id="portal-data">
  {
    "client": "Demo Client",
    "subtitle": "A live demo of the Hirobius portal kit.",
    "lastUpdated": "2026-10-05",
    "contact": {
      "email": "hello@hirobius.com"
    },
    "sections": [
      {
        "type": "status",
        "id": "status",
        "title": "Project Status",
        "phases": [
          {
            "id": "phase-0",
            "title": "Phase 0 — Example",
            "items": [
              {
                "label": "A finished step",
                "status": "done",
                "desc": "Plain rows for simple progress."
              },
              {
                "label": "A step in progress",
                "status": "in-progress"
              },
              {
                "label": "A step not started",
                "status": "upcoming"
              }
            ]
          },
          {
            "id": "need",
            "title": "What we need from you",
            "note": "Tap an item to see what it is and what to send back.",
            "items": [
              {
                "label": "Already decided: data stays on your machine",
                "status": "done"
              },
              {
                "id": "a1",
                "label": "Give us access to the inbox",
                "status": "upcoming",
                "owner": "Client",
                "desc": "One-time setup, about 10 minutes.",
                "fields": [
                  {
                    "k": "What it is",
                    "v": "A rich checklist item: owner chip, labeled fields and steps, opening on tap."
                  },
                  {
                    "k": "Send back",
                    "v": "A confirmation that it's done."
                  }
                ],
                "steps": [
                  "Do the first thing.",
                  "Then the second thing."
                ]
              },
              {
                "id": "b1",
                "label": "Approve the welcome email",
                "status": "in-progress",
                "owner": "Client + Hirobius",
                "fields": [
                  {
                    "k": "Draft",
                    "drafts": [
                      {
                        "subject": "Welcome, {{first_name}}",
                        "body": "Thanks for reaching out.\n\nWe'll be in touch today."
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "type": "updates",
        "id": "updates",
        "title": "Status Updates",
        "items": [
          {
            "date": "2026-10-05",
            "note": "v7: one checklist pattern, no eyebrows, one footer."
          }
        ]
      },
      {
        "type": "links",
        "id": "links",
        "title": "Links",
        "items": [
          {
            "title": "Your website",
            "url": "https://example.com",
            "summary": "example.com",
            "section": "Your business"
          },
          {
            "title": "Shared folder",
            "url": "https://example.com/folder",
            "section": "Shared folders"
          }
        ]
      },
      {
        "type": "docs",
        "id": "docs",
        "title": "Documents",
        "note": "Tap a document to read it here.",
        "items": [
          {
            "title": "Example Document",
            "desc": "Rendered from a markdown block.",
            "bodyId": "doc-example"
          }
        ]
      },
      {
        "type": "cards",
        "id": "safeguards",
        "title": "Built safe by default",
        "columns": 3,
        "items": [
          {
            "title": "Test mode first",
            "text": "Nothing goes out until it's tested."
          },
          {
            "title": "Your data stays yours",
            "text": "No outside AI on customer data."
          },
          {
            "title": "Secrets stay secret",
            "text": "Credentials never live in the code."
          }
        ]
      }
    ]
  }
  </script>

  <script type="text/markdown" id="doc-example">
# Example Document

This document is stored as a markdown block and opened in the in-page reader.

- Lists, **bold**, `code`, and [links](https://example.com) all render.

> Callouts like this work too.
  </script>

  <main id="fallback"><p>Loading the demo…</p></main>

  <script src="/portal.js" defer></script>
</body>
</html>
