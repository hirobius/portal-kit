<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Client Name — Project Portal</title>
<!-- Pin a kit release. Bump vN in BOTH links to upgrade (see RELEASES.md). -->
<link rel="stylesheet" href="https://portal-kit-adrian-6234s-projects.vercel.app/releases/v7/theme.css" />
<style>
  /* Tiny inline fallback so the page is readable if the shared kit can't load. */
  #fallback { max-width:640px; margin:0 auto; padding:2rem 1.25rem;
    font-family:system-ui, sans-serif; line-height:1.55; color:#141414; }
</style>
</head>
<body>
  <!-- A client page is DATA ONLY: this JSON block, markdown bodies, and the two
       kit links. No page-local CSS or scripts (tools/check-portal.mjs fails them).
       Canonical v7 order: status → updates → links → docs, then optional kit
       blocks (assist, cards, request, mermaid). The "links" items are written by
       tools/sync-links.mjs from the repo's links.json — never edit them by hand.
       Long documents go in <script type="text/markdown"> blocks, referenced by "bodyId". -->
  <script type="application/json" id="portal-data">
  {
    "client": "Client Name",
    "subtitle": "Your plan and resources in one place.",
    "lastUpdated": "2026-01-01",
    "contact": {
      "email": "adrian@hirobius.com"
    },
    "sections": [
      {
        "type": "status",
        "id": "status",
        "title": "Project Status",
        "phases": [
          {
            "id": "phase-0",
            "title": "Phase 0 — Title",
            "items": [
              {
                "label": "A finished task",
                "status": "done"
              },
              {
                "label": "A task in progress",
                "status": "in-progress"
              },
              {
                "id": "a1",
                "label": "Something we need from you",
                "status": "upcoming",
                "owner": "Client",
                "fields": [
                  {
                    "k": "What it is",
                    "v": "Detail opens on tap."
                  },
                  {
                    "k": "Send back",
                    "v": "What to reply with."
                  }
                ],
                "steps": [
                  "First step.",
                  "Second step."
                ]
              }
            ]
          }
        ]
      },
      {
        "type": "updates",
        "id": "updates",
        "title": "Status Updates",
        "items": [
          {
            "date": "2026-01-01",
            "note": "First update."
          }
        ]
      },
      {
        "type": "links",
        "id": "links",
        "title": "Links",
        "items": []
      },
      {
        "type": "docs",
        "id": "docs",
        "title": "Documents",
        "items": [
          {
            "title": "Proposal",
            "desc": "Plan and pricing.",
            "bodyId": "doc-proposal"
          }
        ]
      }
    ]
  }
  </script>

  <script type="text/markdown" id="doc-proposal">
# Proposal

Replace this markdown with the real document. It renders in the in-page reader.

- **What we'll do** — the plan.
- **Investment** — the pricing.

> Callouts, tables, and [links](https://example.com) all work here.
  </script>

  <!-- Replaced by portal.js on load; only shows if the shared kit can't load. -->
  <main id="fallback">
    <p>Loading the portal… If this message stays, the shared portal service may be
    temporarily unavailable — please contact us.</p>
  </main>

  <script src="https://portal-kit-adrian-6234s-projects.vercel.app/releases/v7/portal.js" defer></script>
</body>
</html>
